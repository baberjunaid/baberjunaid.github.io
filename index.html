<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Junaid Baber | Portfolio Profiles</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --primary:#0f4c81; --primary-dark:#0b3a63; --soft:#f4f7fb; }
    html, body { height:100%; margin:0; }
    * { box-sizing: border-box; }
    body { background: var(--soft); color:#1f2937; font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif; }
    #profileFrame { width:100%; height:100vh; height:100dvh; border:0; background:#fff; display:block; }
    .lang-control {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
      background: rgba(255,255,255,0.95);
      border: 1px solid #d9e3ef;
      border-radius: 10px;
      padding: 8px 10px;
      box-shadow: 0 8px 20px rgba(15,76,129,0.18);
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(2px);
    }
    .lang-control .icon { font-size: 14px; color: var(--primary-dark); }
    .lang-control select { border: 1px solid #c9d8ea; border-radius: 6px; padding: 3px 6px; font-size: 13px; }
    .admin-toggle {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 9999;
      opacity: 0.28;
      transition: opacity .2s ease;
    }
    .admin-toggle:hover, .admin-toggle:focus-within { opacity: 1; }
    .admin-toggle summary {
      cursor: pointer;
      list-style: none;
      border: 1px solid #d9e3ef;
      border-radius: 10px;
      padding: 4px 8px;
      background: rgba(255,255,255,0.95);
      font-size: 13px;
      user-select: none;
    }
    .admin-toggle[open] summary { margin-bottom: 6px; }
    .admin-panel {
      background: rgba(255,255,255,0.98);
      border: 1px solid #d9e3ef;
      border-radius: 10px;
      padding: 8px;
      box-shadow: 0 8px 20px rgba(15,76,129,0.18);
    }
    .admin-panel label { display:block; font-size:12px; margin-bottom:4px; color:#334155; }
    .admin-panel select { width:170px; border: 1px solid #c9d8ea; border-radius: 6px; padding: 3px 6px; font-size: 13px; }

    @media (max-width: 640px) {
      .lang-control {
        top: 8px;
        right: 8px;
        padding: 6px 8px;
        border-radius: 8px;
      }
      .lang-control .icon { font-size: 13px; }
      .lang-control select { font-size: 12px; padding: 2px 5px; }
      .admin-toggle { top: 8px; left: 8px; }
      .admin-toggle summary { font-size: 12px; padding: 3px 7px; }
      .admin-panel select { width: 150px; font-size: 12px; }
    }

    @media (max-width: 420px) {
      .lang-control {
        gap: 6px;
        max-width: 180px;
      }
      .lang-control select {
        max-width: 120px;
      }
      .admin-panel select {
        width: 130px;
      }
    }
  </style>
</head>
<body>
  <div class="lang-control" aria-label="Language switcher">
    <span class="icon">🌐</span>
    <select id="langSelect" aria-label="Select language">
      <option value="en">English</option>
      <option value="fr">Français</option>
    </select>
  </div>

  <details class="admin-toggle">
    <summary title="Admin profile switch">⚙</summary>
    <div class="admin-panel">
      <label for="profileSelect">Profile (Admin)</label>
      <select id="profileSelect" aria-label="Select profile">
        <option value="engineer">Engineer</option>
        <option value="researcher">Researcher</option>
        <option value="business_researcher">Business Researcher</option>
      </select>
    </div>
  </details>

  <iframe id="profileFrame" title="Portfolio profile"></iframe>

  <script>
    const PROFILE_FILES = {
      engineer: { en: 'profile_engineer_en.html', fr: 'profile_engineer_fr.html' },
      researcher: { en: 'profile_researcher_en.html', fr: 'profile_researcher_fr.html' },
      business_researcher: { en: 'profile_business_researcher_en.html', fr: 'profile_business_researcher_fr.html' }
    };

    const profileSelect = document.getElementById('profileSelect');
    const langSelect = document.getElementById('langSelect');
    const frame = document.getElementById('profileFrame');

    function resolveByFile(fileName) {
      for (const [profile, langs] of Object.entries(PROFILE_FILES)) {
        for (const [lang, file] of Object.entries(langs)) {
          if (file === fileName) return { profile, lang };
        }
      }
      return null;
    }

    function loadProfile(profile, lang) {
      if (!PROFILE_FILES[profile]) profile = 'engineer';
      if (!PROFILE_FILES[profile][lang]) lang = 'en';
      profileSelect.value = profile;
      langSelect.value = lang;
      frame.src = PROFILE_FILES[profile][lang];
    }

    async function readActiveProfile() {
      try {
        const res = await fetch(`active-profile.txt?t=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error('missing');
        const raw = (await res.text()).trim();
        if (PROFILE_FILES[raw]) return { profile: raw, lang: 'en' };
        const byFile = resolveByFile(raw);
        if (byFile) return byFile;
      } catch (_) {}
      return { profile: 'engineer', lang: 'en' };
    }

    async function init() {
      const active = await readActiveProfile();
      const profile = active.profile || 'engineer';
      const lang = active.lang || 'en';
      loadProfile(profile, lang);
    }

    profileSelect.addEventListener('change', () => loadProfile(profileSelect.value, langSelect.value));
    langSelect.addEventListener('change', () => loadProfile(profileSelect.value, langSelect.value));

    init();
  </script>
</body>
</html>
